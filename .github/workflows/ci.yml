name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        run: uv sync --extra dev
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format check)
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -q
      - name: Security tests (must be green)
        run: uv run pytest -q -m security --no-cov

  sbom-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - name: pip-audit (deps CVE scan)
        run: |
          uv export --extra dev --no-emit-project --format requirements-txt -q > requirements-audit.txt
          uv run pip-audit --strict --disable-pip --no-deps -r requirements-audit.txt
      - name: CycloneDX SBOM
        run: |
          uv export --no-dev --no-emit-project --format requirements-txt -q > requirements-runtime.txt
          uv run cyclonedx-py requirements requirements-runtime.txt --of JSON -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm
      - name: Render with inventory + credential mapping
        run: |
          helm template t deploy/helm \
            --set inventory.configMap.enabled=true \
            --set 'mqCredentials.items[0].key=prod-eu1-username' \
            --set 'mqCredentials.items[0].path=prod/eu1/username' > rendered.yaml
          grep -q 'MQS_SERVER_INVENTORY_DIR' rendered.yaml
          grep -q 'path: prod/eu1/username' rendered.yaml
          helm template t deploy/helm --set ingress.enabled=true \
            --set 'ingress.tls[0].hosts[0]=mq.example.com' \
            --set 'ingress.hosts[0].host=mq.example.com' \
            --set 'ingress.hosts[0].paths[0].path=/' \
            --set 'ingress.hosts[0].paths[0].pathType=Prefix' > rendered-ingress.yaml
          grep -q 'value: "https://mq.example.com/mcp"' rendered-ingress.yaml

  image-build-scan-sign:
    runs-on: ubuntu-latest
    needs: [lint-type-test, sbom-and-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # cosign keyless signing
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker build -f deploy/Dockerfile -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
      - name: Smoke test image
        run: docker run --rm ghcr.io/${{ github.repository }}:${{ github.sha }} tools --json
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Push + sign
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          cosign sign --yes ghcr.io/${{ github.repository }}:${{ github.sha }}
