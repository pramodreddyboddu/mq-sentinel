image:
  repository: ghcr.io/pramodreddyboddu/mq-sentinel
  tag: "0.4.0"   # Pin to a known good release for org deploys. Update on new releases.
  pullPolicy: IfNotPresent

replicaCount: 2   # Increase for larger orgs / higher query volume

env:
  MQS_SERVER_ENVIRONMENT: prod
  MQS_SERVER_TRANSPORT: http
  MQS_SERVER_HTTP_HOST: "0.0.0.0"
  MQS_SERVER_HTTP_PORT: "8080"
  MQS_AUDIT_LOG_PATH: /var/audit/audit.jsonl
  MQS_SECURITY_RATE_LIMIT_PER_MINUTE: "60"
  # OIDC config — required in production. Inject via the Helm `oidc` block.
  # MQS_AUTH_OIDC_ISSUER:    set from values.oidc.issuer
  # MQS_AUTH_OIDC_AUDIENCE:  set from values.oidc.audience
  # MQS_AUTH_OIDC_JWKS_URL:  set from values.oidc.jwksUrl

# OIDC — REQUIRED for prod. The deployment refuses to start if any of these
# are empty when MQS_SERVER_ENVIRONMENT=prod.
oidc:
  issuer: ""       # e.g. https://login.example.com/realms/mq-sentinel
  audience: ""     # e.g. mq-sentinel
  jwksUrl: ""      # e.g. https://login.example.com/realms/mq-sentinel/protocol/openid-connect/certs

# Example for common enterprise IdPs (copy and fill in your values):
# Okta example:
# oidc:
#   issuer: https://your-org.okta.com/oauth2/default
#   audience: mq-sentinel
#   jwksUrl: https://your-org.okta.com/oauth2/default/v1/keys
#
# Azure Entra ID example:
# oidc:
#   issuer: https://login.microsoftonline.com/<tenant>/v2.0
#   audience: <your-app-client-id>
#   jwksUrl: https://login.microsoftonline.com/<tenant>/discovery/v2.0/keys

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

networkPolicy:
  enabled: true
  allowedEgressCIDRs: []  # CRITICAL for orgs: populate with only your MQ listener subnets

service:
  type: ClusterIP
  port: 8080

podDisruptionBudget:
  minAvailable: 1

# =============================================================================
# ORG / ENTERPRISE PRODUCTION RECOMMENDATIONS
# =============================================================================
# - Use external-secrets or sealed-secrets for OIDC and MQ credentials.
# - Restrict networkPolicy.allowedEgressCIDRs to only your MQ subnets.
# - Enable PodDisruptionBudget and consider PodAntiAffinity for HA.
# - For fleets of 50+ QMs, consider external inventory backend (future roadmap).
# - Ship /var/audit to your SIEM (Splunk, ELK, etc.).
# - Monitor /healthz, /readyz, and Prometheus /metrics.

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  # targetMemoryUtilizationPercentage: 70

# Recommended for production orgs
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - mq-sentinel
          topologyKey: kubernetes.io/hostname

# Inventory: a ConfigMap of *.yaml files (schema: examples/org/inventory-example.yaml),
# mounted at /etc/mq-sentinel and loaded via MQS_SERVER_INVENTORY_DIR.
# MQS_SERVER_ENVIRONMENT=prod refuses to start without one (no demo data in prod).
inventory:
  configMap:
    enabled: false
    name: mq-sentinel-inventory

# MQ credentials Secret, mounted at /var/secrets (MQS_SERVER_SECRETS_DIR).
# Each inventory secret_ref is a directory holding `username` and `password`.
# Secret keys can't contain "/", so map them to <secret_ref>/<file> paths:
mqCredentials:
  secretName: ""   # default: <release>-mq-credentials
  items: []
  # - {key: prod-eu1-username, path: prod/eu1/username}
  # - {key: prod-eu1-password, path: prod/eu1/password}

# Monitoring annotations for Prometheus service discovery
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

# ServiceMonitor for Prometheus Operator (recommended in orgs)
serviceMonitor:
  enabled: false
  namespace: monitoring
  labels: {}
  interval: 30s
  scrapeTimeout: 10s

# Ingress (for HTTP transport when exposing internally)
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: mq-sentinel.internal.your-org.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: mq-sentinel-tls
  #    hosts:
  #      - mq-sentinel.internal.your-org.com

# For very large orgs or high availability
topologySpreadConstraints: []
# - maxSkew: 1
#   topologyKey: topology.kubernetes.io/zone
#   whenUnsatisfiable: DoNotSchedule
#   labelSelector:
#     matchLabels:
#       app.kubernetes.io/name: mq-sentinel

serviceAccount:
  create: true
  annotations: {}
  name: ""

# Additional org-friendly settings
extraLabels: {}
extraAnnotations: {}
