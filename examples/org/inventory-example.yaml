# Example inventory for a mid-to-large organization.
# Point MQS_SERVER_INVENTORY_DIR at the directory holding this file (or mount it
# as a ConfigMap). Every *.yaml in that directory is loaded at startup.
#
# Credentials never live here. `secret_ref` names a directory under
# MQS_SERVER_SECRETS_DIR containing `username` and `password` files (plus
# optional `keystore_path`, `keystore_password`, `cert_label` for TLS).
#
# Use a dedicated, display-only SVRCONN channel and MQ user. See
# docs/onboard-new-qm.md for the setmqaut / CHLAUTH grants.

qms:
  - qm_name: PROD_QM_EU1          # Primary EU production QM for payments
    host: mq-prod-eu1.internal
    port: 1414
    channel: MQS.SVRCONN
    environment: prod
    topology_hint: native_ha
    mq_version_hint: "9.4"
    secret_ref: prod/eu1
    cipher_spec: ANY_TLS13_OR_HIGHER

  - qm_name: PROD_QM_US1          # US production QM
    host: mq-prod-us1.internal
    port: 1414
    channel: MQS.SVRCONN
    environment: prod
    topology_hint: rdqm
    secret_ref: prod/us1
    cipher_spec: ANY_TLS13_OR_HIGHER

  - qm_name: NONPROD_QM_EU1       # Non-prod for EU testing
    host: mq-np-eu1.internal
    port: 1414
    channel: MQS.SVRCONN
    environment: nonprod
    topology_hint: uniform_cluster
    secret_ref: nonprod/eu1

  - qm_name: ZOS_QSG_MAIN         # z/OS queue-sharing group, mainframe core
    host: mq-zos-main.internal
    port: 1414
    channel: MQS.SVRCONN
    environment: prod
    topology_hint: zos_qsg
    secret_ref: prod/zos-main
    cipher_spec: ANY_TLS12_OR_HIGHER

# InMemoryInventory is fine up to a few hundred QMs. For very large estates,
# back the InventoryRegistry protocol with an internal service or database.
