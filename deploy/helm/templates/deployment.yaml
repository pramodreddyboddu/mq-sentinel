apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: mq-sentinel
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mq-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mq-sentinel
    spec:
      serviceAccountName: {{ include "mq-sentinel.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: mq-sentinel
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: "{{ $v }}"
            {{- end }}
            - name: MQS_SERVER_SECRETS_DIR
              value: /var/secrets
            {{- if .Values.inventory.configMap.enabled }}
            - name: MQS_SERVER_INVENTORY_DIR
              value: /etc/mq-sentinel
            {{- end }}
            {{- if .Values.oidc.issuer }}
            - name: MQS_AUTH_OIDC_ISSUER
              value: "{{ .Values.oidc.issuer }}"
            {{- end }}
            {{- if .Values.oidc.audience }}
            - name: MQS_AUTH_OIDC_AUDIENCE
              value: "{{ .Values.oidc.audience }}"
            {{- end }}
            {{- if .Values.oidc.scopes }}
            - name: MQS_AUTH_OIDC_SCOPES
              value: "{{ .Values.oidc.scopes }}"
            {{- end }}
            {{- if and .Values.ingress.enabled (not (hasKey .Values.env "MQS_SERVER_PUBLIC_URL")) }}
            # MCP endpoint as clients see it: OAuth resource id + allowed Host header
            - name: MQS_SERVER_PUBLIC_URL
              value: "{{ if .Values.ingress.tls }}https{{ else }}http{{ end }}://{{ (index .Values.ingress.hosts 0).host }}/mcp"
            {{- end }}
            {{- if .Values.oidc.jwksUrl }}
            - name: MQS_AUTH_OIDC_JWKS_URL
              value: "{{ .Values.oidc.jwksUrl }}"
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: audit
              mountPath: /var/audit
            - name: secrets
              mountPath: /var/secrets
              readOnly: true
            {{- if .Values.inventory.configMap.enabled }}
            - name: inventory
              mountPath: /etc/mq-sentinel
              readOnly: true
            {{- end }}
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
      volumes:
        - name: audit
          emptyDir: {}
        - name: secrets
          secret:
            secretName: {{ .Values.mqCredentials.secretName | default (printf "%s-mq-credentials" .Release.Name) }}
            defaultMode: 0400
            {{- with .Values.mqCredentials.items }}
            items:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- if .Values.inventory.configMap.enabled }}
        - name: inventory
          configMap:
            name: {{ .Values.inventory.configMap.name | default (printf "%s-inventory" .Release.Name) }}
        {{- end }}
